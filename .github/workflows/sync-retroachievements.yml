name: Sync RetroAchievements
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch achievements and progress
        env:
          RA_WEB_API_KEY: ${{ secrets.RA_WEB_API_KEY }}
        run: python scripts/sync_ra.py
      - name: Commit sanitized snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ra-progress.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update RetroAchievements progress'
            git push
          fi
